name: Repair PatchMe avatar assets

on:
  push:
    branches:
      - feature/090-avatar-rewards
    paths:
      - .github/workflows/fix-avatar-assets.yml

permissions:
  contents: write

jobs:
  repair-avatars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/090-avatar-rewards

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Re-encode original Patchy PNGs without metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = [
              Path('public/assets/patchy-cat.png'),
              Path('public/assets/patchy-dog.png'),
              Path('public/assets/patchy-moon-guardian.png'),
          ]

          for path in files:
              with Image.open(path) as source:
                  image = source.convert('RGBA')
                  image.save(path, format='PNG', optimize=True)
                  print(f'{path}: {image.size[0]}x{image.size[1]} re-encoded')
          PY

      - name: Restore app references to original artwork
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/patchy-shop.ts')
          text = path.read_text()
          text = text.replace('/assets/patchy-cat-original.svg', '/assets/patchy-cat.png')
          text = text.replace('/assets/patchy-dog-original.svg', '/assets/patchy-dog.png')
          text = text.replace('/assets/patchy-moon-guardian-original.svg', '/assets/patchy-moon-guardian.png')
          path.write_text(text)
          PY

      - name: Commit repaired originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/patchy-cat.png public/assets/patchy-dog.png public/assets/patchy-moon-guardian.png src/lib/patchy-shop.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: re-encode original Patchy avatar artwork"
          git push origin HEAD:feature/090-avatar-rewards
