name: Build high-resolution PatchMe avatar PNGs

on:
  push:
    branches:
      - feature/090-avatar-rewards
    paths:
      - .github/workflows/fix-avatar-assets.yml

permissions:
  contents: write

jobs:
  build-avatar-pngs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/090-avatar-rewards

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Export current regenerated avatars as 1024px lossless PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          names = ['patchy-cat', 'patchy-dog', 'patchy-moon-guardian']
          for name in names:
              source = Path(f'public/assets/{name}.webp')
              target = Path(f'public/assets/{name}-hq.png')
              with Image.open(source) as opened:
                  image = opened.convert('RGBA')
                  image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
                  image.save(target, format='PNG', optimize=False, compress_level=6)
                  print(f'{target}: {image.size[0]}x{image.size[1]} RGBA PNG')
          PY

      - name: Point PatchMe to lossless PNG avatars
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/patchy-shop.ts')
          text = path.read_text()
          text = text.replace('/assets/patchy-cat.webp', '/assets/patchy-cat-hq.png')
          text = text.replace('/assets/patchy-dog.webp', '/assets/patchy-dog-hq.png')
          text = text.replace('/assets/patchy-moon-guardian.webp', '/assets/patchy-moon-guardian-hq.png')
          path.write_text(text)
          PY

      - name: Commit high-resolution PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/patchy-cat-hq.png public/assets/patchy-dog-hq.png public/assets/patchy-moon-guardian-hq.png src/lib/patchy-shop.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: use high-resolution PNG Patchy avatars"
          git push origin HEAD:feature/090-avatar-rewards
